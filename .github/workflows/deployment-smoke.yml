name: Deployment Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview or production URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  deployment-smoke:
    name: Deployment Smoke
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.event.deployment.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed site
        run: npm run test:smoke
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
