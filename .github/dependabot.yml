version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    assignees:
      - FLABDUL
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: wednesday
      time: "07:15"
      timezone: Europe/London
    open-pull-requests-limit: 2
    assignees:
      - FLABDUL
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    assignees:
      - FLABDUL
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
